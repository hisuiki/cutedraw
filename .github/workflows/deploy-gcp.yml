name: Deploy Cutedraw to Cloud Run

on:
  push:
    branches:
      - main
    paths-ignore:
      - "terraform/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Google Cloud authentication configuration
        id: auth_config
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          if [[ -n "$WIF_PROVIDER" && -n "$SERVICE_ACCOUNT" ]]; then
            echo "method=wif" >> "$GITHUB_OUTPUT"
          elif [[ -n "$CREDENTIALS_JSON" ]]; then
            echo "method=credentials_json" >> "$GITHUB_OUTPUT"
          else
            echo "method=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Google Cloud authentication configuration
        if: ${{ steps.auth_config.outputs.method == 'missing' }}
        run: |
          echo "::error::Configure either GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT (as repository secrets or variables), or GCP_CREDENTIALS_JSON as a repository secret."
          exit 1

      - name: Authenticate to Google Cloud with workload identity
        if: ${{ steps.auth_config.outputs.method == 'wif' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud with credentials JSON
        if: ${{ steps.auth_config.outputs.method == 'credentials_json' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and deploy image
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WEB_SERVICE: ${{ vars.GCP_WEB_SERVICE }}
          GCP_URL_MAP: ${{ vars.GCP_URL_MAP }}
        run: scripts/build-and-deploy-gcp.sh --tag "${{ github.sha }}"
