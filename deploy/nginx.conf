server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite hashes application assets, so browsers and Cloud CDN can retain them forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Font file names are stable across some upstream releases, so keep their TTL bounded.
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Excalidraw is a client-rendered app. Unknown routes must return the shell, while the shell
    # itself must always be revalidated so a deployment cannot strand clients on an old chunk map.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
